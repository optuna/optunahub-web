name: GitHub Pages

on:
  push:
    branches:
      - main  # Set a branch name to trigger deployment
  pull_request: {}
  schedule:
      - cron: '0 * * * *'  # Update every hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: (github.event_name == 'schedule' && github.repository == 'optuna/optunahub-web') || (github.event_name != 'schedule')
    runs-on: ubuntu-latest
    permissions:
        contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name:
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.124.1'

      - name: Checkout Registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: optuna/optunahub-registry
          path: optunahub-registry

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
            python-version: 3.11

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare Contents
        run: python hugo_build.py

      - name: Build
        run: hugo --minify

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    if: (github.event_name == 'schedule' && github.repository == 'optuna/optunahub-web') || (github.event_name != 'schedule' && github.event_name != 'pull_request')
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
